spring:
  application:
    name: factory-backend
  # 로컬 비밀값은 git 에 올리지 않는 application-local.yml 에 둔다 (application-local.example.yml 참고)
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: jdbc:postgresql://localhost:5432/factory_demo
    username: factory
    password: ${DB_PASSWORD:}
  # 스키마는 Flyway(db/migration)가 만든다. Flyway 도입 전 테이블이 있는 DB는 V1 기준선으로 등록하고 V2부터 적용
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8080

app:
  mqtt:
    broker-url: tcp://localhost:1883
    client-id: factory-backend
    topic: factory/line1/+/telemetry
    alarm-topic: factory/line1/alarms
    handover-topic: factory/line1/handover/requests
  # 설비 유형 → 지표 → 임계값 (warn/crit × high/low, 필요한 것만)
  # 정상 운전값: 탱크 레벨 65~70%, 온도 25~40C / 배합기 진동 2.5mm/s, 전류 12A / 충진기 120bpm
  alarm:
    rules:
      "[RAW_TANK]":
        level: { warn-low: 25, crit-low: 15, warn-high: 95 }
        temperature: { warn-high: 50, crit-high: 60 }
      "[MIXER]":
        vibration: { warn-high: 4.5, crit-high: 7.1 }   # ISO 10816 구역 경계 참고
        current: { warn-high: 18, crit-high: 22 }
      "[FILLER]":
        speed: { warn-low: 100, crit-low: 80 }

logging:
  level:
    com.factoryagent: INFO
  # 콘솔과 함께 파일에도 남긴다 (실행 위치 기준 logs/backend.log, 10MB 단위로 순환)
  file:
    name: ${LOG_DIR:logs}/backend.log
  charset:
    file: UTF-8
